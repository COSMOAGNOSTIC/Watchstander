[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchstander"
version = "0.1.0"
description = "LangGraph multi-agent system for OSHA 1915 shipyard safety spatial/temporal deconfliction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]
llm = [
    "anthropic>=0.40",
]

[tool.setuptools.packages.find]
include = ["agent_core*"]
