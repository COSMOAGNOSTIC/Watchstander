[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchstander"
version = "0.1.0"
description = "LangGraph multi-agent system for OSHA 1915 shipyard safety spatial/temporal deconfliction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]
llm = [
    "anthropic>=0.40",
]
# Only needed to run retrieval/embedder.py and retrieval/vector_store.py for
# real (retrieval/ingest.py, or a live retriever.retrieve() call). The test
# suite never imports these for real -- see embedder.py's module docstring
# -- so this stays optional. Added now that Phase 1 actually uses them
# (MIGRATION.md: "don't add unused deps in Phase 0").
retrieval = [
    "sentence-transformers>=3",
    "chromadb>=0.5",
]

[tool.setuptools.packages.find]
# "eval*" is needed so tests/test_eval_harness.py's `from eval.run_eval import
# ...` resolves regardless of how pytest is invoked. Without this, `eval/` was
# only importable when pytest ran via `python -m pytest` (which prepends cwd
# to sys.path) -- CI runs the `pytest` console script directly, which does
# not, so this passed in every local check (always run as `python -m pytest`)
# and failed in CI on every run since the eval harness was added. Packaging
# `eval/` the same way `agent_core` already is makes it importable via the
# editable install itself, independent of invocation style.
#
# "retrieval*" (added retrieval/MIGRATION.md Phase 0) is included up front for
# the same reason, proactively -- this is the exact failure mode described
# above, so there's no reason to wait for CI to go red on it first.
include = ["agent_core*", "eval*", "retrieval*"]
