name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # "retrieval" added alongside the Phase 1 real-logic build
      # (retrieval/MIGRATION.md) -- VectorStore now imports chromadb for
      # real (tests exercise real Chroma storage/query logic, only the
      # embedding vectors themselves are faked), so it's a real test
      # dependency here, not just a runtime-only extra. Installing only
      # ".[dev]" would repeat the exact CI-vs-local install-path gap
      # documented in AOSE.md's "verification blind spot" section (the
      # eval/ package import failure) -- caught here proactively instead.
      #
      # "reviewer" added alongside Phase 7 (reviewer/) -- tests/test_reviewer.py
      # imports fastapi.testclient for real, same reasoning as "retrieval"
      # above: caught before this ever went red, by checking this exact
      # file against the new optional-dependency group rather than assuming
      # a local "python -m pytest" pass meant CI would pass too.
      - run: pip install -e ".[dev,retrieval,reviewer]"
      - run: pytest -v
